[package]
name = "axvirtio-blk"
version = "0.1.0"
edition = "2024"
authors = ["Axvisor Contributors"]
description = "Virtio-blk virtual block device implementation for Axvisor"
license = "GPL-3.0-or-later OR Apache-2.0 OR MulanPSL-2.0"

[features]
default = []
fs = ["dep:axstd"]

[dependencies]
log = "0.4"
spin = "0.9"
cfg-if = "1.0"

# System independent crates
axerrno = "0.2"
axaddrspace = "0.1"
axdevice_base = "0.1"
memory_addr = "0.4"
axvmconfig = { git = "https://github.com/DINGBROK423/axvmconfig.git", branch = "merge_add_virtio_mmio", default-features = false }

# For file system access (when fs feature is enabled)
# Use the same axstd version as axvisor to avoid version conflicts
axstd = { git = "https://github.com/arceos-org/arceos.git", tag = "dev-251202", optional = true, features = ["fs"] }

